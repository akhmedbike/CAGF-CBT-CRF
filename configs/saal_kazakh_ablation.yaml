# Weight-sensitivity ablation for the SAAL acquisition function
# (branch siccis-malta; reviewer point 3, Weak Accept: "It would be useful
# to discuss how sensitive the results are to these coefficients").
#
# Scope: Kazakh-KTB only, the 20% budget checkpoint (10% is evaluated on the
# way at no extra cost), the same 10 fixed splits as the main experiments.
# Only the Eq. (7)-(8) coefficients change; the pipeline, surrogate and
# feature representation are identical across all strategies.
#
# Token-level order of Eq. (7) weights: [H_u, H_r, q*p_T, N_suf, N_lex].
# Sentence-level order of Eq. (8) weights: [mean, max].

data:
  corpus_paths:
    - data/gold/ud_kk_train.conllu
    - data/gold/ud_kk_test.conllu

simulation:
  seeds: [7, 13, 19, 31, 42, 55, 77, 101, 123, 202]
  pool_fraction: 0.8
  initial_fraction: 0.05
  budgets: [0.1, 0.2]

surrogate:
  feature_dim: 2048
  ngram_range: [2, 5]
  c: 1.0
  max_iter: 500
  # 'multinomial' (softmax lbfgs) or 'liblinear_ovr' (one-vs-rest liblinear).
  # Diagnostics (docs/weight_sensitivity_kazakh.md) show liblinear_ovr
  # reproduces the published Entropy/Random/Novelty TSC levels almost
  # exactly; switching the default is pending the decision on whether the
  # original Table 2-4 code can be recovered.
  solver: multinomial

strategies:
  # Reference strategies for comparison with the published Table 2.
  random: {}
  entropy: {}
  novelty: {}
  # Eq. (7)-(8) weight configurations.
  baseline:
    acquisition_weights: [0.25, 0.20, 0.30, 0.15, 0.10]
    sentence_weights: [0.8, 0.2]
  equal:
    acquisition_weights: [0.20, 0.20, 0.20, 0.20, 0.20]
    sentence_weights: [0.8, 0.2]
  support-heavy:
    acquisition_weights: [0.10, 0.10, 0.60, 0.10, 0.10]
    sentence_weights: [0.8, 0.2]
  novelty-heavy:
    acquisition_weights: [0.10, 0.10, 0.10, 0.35, 0.35]
    sentence_weights: [0.8, 0.2]
  uncertainty-heavy:
    acquisition_weights: [0.35, 0.35, 0.10, 0.10, 0.10]
    sentence_weights: [0.8, 0.2]
  mean-only:
    acquisition_weights: [0.25, 0.20, 0.30, 0.15, 0.10]
    sentence_weights: [1.0, 0.0]
  balanced:
    acquisition_weights: [0.25, 0.20, 0.30, 0.15, 0.10]
    sentence_weights: [0.5, 0.5]
